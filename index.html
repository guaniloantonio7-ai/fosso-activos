<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>FOSSO - Inventario Activos Fijos</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2@1.8.4/dist/quagga.min.js"></script>
  <style>
    :root {
      --primary-dark: #163a5f;
      --btn-blue: #1d446b;
      --btn-slate: #435365;
      --btn-green: #229954;
      --btn-red: #c0392b;
      --btn-amber: #d68910;
      --bg-gray: #eef1f5;
      --border-color: #d5dce4;
      --text-main: #1f2d3d;
      --text-muted: #6c7a89;
    }

    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; background-color: var(--bg-gray); color: var(--text-main); padding-bottom: 30px; }

    header {
      background-color: var(--primary-dark);
      color: white;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }
    header h1 { margin: 0; font-size: 1.1rem; font-weight: 700; }
    header p { margin: 2px 0 0; font-size: 0.72rem; color: #a3e4d7; font-weight: 600; }

    .header-actions { display: flex; gap: 6px; }
    .btn-export {
      border: none;
      padding: 8px 10px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.8rem;
      color: white;
      cursor: pointer;
    }
    .btn-sync { background-color: #0e7490; }
    .btn-pdf { background-color: var(--btn-red); }
    .btn-csv { background-color: var(--btn-green); }

    .card {
      background: white;
      margin: 14px;
      padding: 18px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .card.editing-mode {
      border: 2px solid var(--btn-amber);
      background: #fffdf7;
    }
    .card-header-flex {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      gap: 8px;
    }
    .card-title {
      color: var(--primary-dark);
      font-size: 1.05rem;
      font-weight: 700;
      margin: 0;
    }
    .btn-new-mode {
      background: var(--primary-dark);
      color: white;
      border: none;
      padding: 7px 11px;
      border-radius: 7px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      display: none;
    }

    .edit-banner {
      display: none;
      background: #fef5e7;
      border-left: 4px solid var(--btn-amber);
      color: #9c640c;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .row-item-estado { display: grid; grid-template-columns: 65px 1fr; gap: 10px; margin-bottom: 12px; }
    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }

    label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 5px; color: var(--text-main); }
    label.accent-blue { color: var(--primary-dark); }

    input, select, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 0.92rem;
      background: #fff;
      color: var(--text-main);
    }
    textarea { resize: vertical; min-height: 58px; }

    .tag-box {
      background: #f4f7fb;
      border: 1.5px dashed #2e6da4;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 14px;
    }
    .af-input-group { display: flex; gap: 6px; align-items: center; }
    .af-prefix {
      background: var(--primary-dark);
      color: white;
      padding: 10px 11px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.9rem;
      white-space: nowrap;
    }
    .btn-scan {
      background: #0e7490;
      color: white;
      border: none;
      padding: 10px 11px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.82rem;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-scan.active { background: #c0392b; }

    .status-lookup {
      font-size: 0.78rem;
      margin-top: 6px;
      font-weight: 600;
      color: #b9770e;
      display: none;
    }

    #scannerContainer {
      display: none;
      position: relative;
      width: 100%;
      height: 180px;
      margin-top: 10px;
      border-radius: 8px;
      overflow: hidden;
      background: #000;
    }
    #scannerContainer video, #scannerContainer canvas {
      width: 100% !important;
      height: 180px !important;
      object-fit: cover;
      position: absolute;
      top: 0;
      left: 0;
    }
    .scan-box-target {
      position: absolute;
      top: 25%;
      left: 12%;
      width: 76%;
      height: 50%;
      border: 2px solid #00ff66;
      border-radius: 6px;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.45);
      pointer-events: none;
      z-index: 10;
    }
    .scan-hint {
      position: absolute;
      bottom: 4px;
      width: 100%;
      text-align: center;
      color: white;
      font-size: 0.72rem;
      z-index: 12;
      pointer-events: none;
    }

    .btn-photo {
      width: 100%;
      background-color: var(--btn-slate);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      margin: 8px 0 14px;
      cursor: pointer;
    }
    .btn-photo.has-photo { background-color: var(--btn-green); }

    .btn-save {
      width: 100%;
      background-color: var(--btn-blue);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      margin-top: 8px;
      cursor: pointer;
    }
    .btn-save.update-mode { background-color: var(--btn-amber); }
    .btn-save:disabled { opacity: 0.6; }

    .preview-img {
      width: 100%;
      max-height: 180px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 12px;
      display: none;
      border: 1px solid var(--border-color);
    }

    .filter-bar {
      background: #f8fafc;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      margin-bottom: 12px;
    }

    .history-item {
      border-bottom: 1px solid var(--border-color);
      padding: 12px 0;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .history-item:last-child { border-bottom: none; }
    .history-thumb { width: 58px; height: 58px; border-radius: 8px; object-fit: cover; background: #e2e8f0; flex-shrink: 0; }
    .history-info { flex: 1; font-size: 0.83rem; line-height: 1.38; }
    .tag-pill { background: #163a5f; color: #fff; font-weight: 700; padding: 2px 7px; border-radius: 4px; font-size: 0.74rem; }
    .cat-pill { background: #e1ecf4; color: #163a5f; font-weight: 700; padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; }
    .badge { display: inline-block; padding: 2px 7px; border-radius: 4px; font-size: 0.7rem; font-weight: 700; color: white; }
    .badge.BUENO { background: #229954; }
    .badge.REGULAR { background: #d68910; }
    .badge.MALO { background: #c0392b; }

    .item-actions { display: flex; flex-direction: column; gap: 6px; }
    .btn-edit { background: #fef5e7; color: #b9770e; border: 1px solid #f5cba7; padding: 6px 9px; border-radius: 6px; font-weight: 700; font-size: 0.78rem; cursor: pointer; }
    .btn-del { background: #fadbd8; color: #c0392b; border: none; padding: 6px 9px; border-radius: 6px; font-weight: 700; font-size: 0.78rem; cursor: pointer; }

    .btn-more {
      width: 100%;
      background: #e2e8f0;
      color: var(--primary-dark);
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: 700;
      margin-top: 10px;
      cursor: pointer;
    }
    footer {
      text-align: center;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--primary-dark);
      margin-top: 20px;
      padding: 0 14px;
    }
  </style>
</head>
<body>

<header>
  <div>
    <h1>FOSSO - Activos Fijos</h1>
    <p id="syncStatus">● Sincronizando...</p>
  </div>
  <div class="header-actions">
    <button class="btn-export btn-sync" onclick="sincronizarNube(true)" title="Sincronizar ahora">🔄</button>
    <button class="btn-export btn-csv" id="btnExportExcel" onclick="exportarExcel()">📊 Excel</button>
    <button class="btn-export btn-pdf" id="btnExportPdf" onclick="generarPDF()">📄 PDF</button>
  </div>
</header>

<div class="card" id="formCard">
  <div class="card-header-flex">
    <h2 class="card-title" id="formTitle">Registro de Activo FOSSO</h2>
    <button type="button" class="btn-new-mode" id="btnNuevoRegistro" onclick="activarModoNuevo()">➕ Nuevo Registro</button>
  </div>

  <div class="edit-banner" id="editBanner">
    ✏️ Editando registro #<span id="editItemNum"></span> — Modifica los datos o vuelve a tomar la foto.
  </div>

  <div class="tag-box">
    <label class="accent-blue">1. Código de Barras FOSSO (Opcional si no tiene)</label>
    <div class="af-input-group">
      <span class="af-prefix">AF -</span>
      <input type="text" id="numAF" inputmode="numeric" placeholder="0537" oninput="verificarHistorialLocal(this.value)">
      <button type="button" class="btn-scan" id="btnScan" onclick="toggleScanner()">📷 Vivo</button>
      <button type="button" class="btn-scan" style="background:#1d446b;" onclick="document.getElementById('scanPhotoInput').click()">🖼️ Foto</button>
    </div>
    <input type="file" id="scanPhotoInput" accept="image/*" capture="environment" style="display:none" onchange="escanearDesdeFoto(event)">
    <div id="lookupMsg" class="status-lookup"></div>

    <div id="scannerContainer">
      <div class="scan-box-target"></div>
      <div class="scan-hint">Mantén el celular a 25 cm (Zoom 2x activo)</div>
    </div>

    <div class="row-2" style="margin-top: 10px; margin-bottom: 0;">
      <div>
        <label>Campaña Etiqueta</label>
        <select id="campanaInv">
          <option value="INV 2026">INV 2026</option>
          <option value="INV 2025">INV 2025</option>
          <option value="INV 2023">INV 2023</option>
          <option value="SIN ETIQUETA">SIN ETIQUETA</option>
        </select>
      </div>
      <div>
        <label>Etiqueta / Tipo de Bien</label>
        <select id="categoriaBien">
          <option value="EQUIPO / MAQUINARIA">EQUIPO / MAQUINARIA</option>
          <option value="MOBILIARIO">MOBILIARIO (ESCRITORIO, SILLA, MESA)</option>
          <option value="ESTANTERÍA / RACKS">ESTANTERÍA / RACKS</option>
          <option value="MENAJE / VAJILLA">MENAJE / VAJILLA</option>
          <option value="CÓMPUTO / ELECTRÓNICA">CÓMPUTO / ELECTRÓNICA</option>
          <option value="OTROS BIENES">OTROS BIENES</option>
        </select>
      </div>
    </div>
  </div>

  <div class="row-item-estado">
    <div>
      <label>Ítem</label>
      <input type="number" id="itemNum" value="1" readonly>
    </div>
    <div>
      <label>Estado Físico</label>
      <select id="condicion">
        <option value="BUENO">BUENO</option>
        <option value="REGULAR">REGULAR</option>
        <option value="MALO">MALO / BAJA</option>
      </select>
    </div>
  </div>

  <div style="margin-bottom: 12px;">
    <label class="accent-blue">Área Operativa</label>
    <select id="area">
      <option value="COMEDOR">COMEDOR</option>
      <option value="VAJILLA">VAJILLA</option>
      <option value="COCINA">COCINA</option>
      <option value="ALMACÉN DE ABARROTES">ALMACÉN DE ABARROTES</option>
      <option value="REEFER DE VERDURAS, TUBÉRCULOS Y FRUTAS">REEFER DE VERDURAS, TUBÉRCULOS Y FRUTAS</option>
      <option value="REEFER DE PRE ELABORADOS">REEFER DE PRE ELABORADOS</option>
    </select>
  </div>

  <div style="margin-bottom: 12px;">
    <label class="accent-blue">Sede / Operación / Unidad</label>
    <input type="text" id="unidad" placeholder="Ej. Agrolmos, UniFrutti, Oficina Trujillo...">
  </div>

  <div style="margin-bottom: 12px;">
    <label class="accent-blue">Descripción del Objeto / Equipo</label>
    <input type="text" id="nombreEquipo" placeholder="Ej. Estante metálico 5 niveles, Escritorio melamina, Cocina...">
  </div>

  <div class="row-2">
    <div>
      <label>Marca / Modelo / Material</label>
      <input type="text" id="marcaModelo" placeholder="Ej. Coldex / Acero Inox / Melamina">
    </div>
    <div>
      <label>N° Serie / Medidas</label>
      <input type="text" id="numSerie" placeholder="Ej. SN-884210 o 1.80x0.50m">
    </div>
  </div>

  <input type="file" id="fotoInput" accept="image/*" style="display:none" onchange="procesarFoto(event)">
  <button type="button" class="btn-photo" id="btnFoto" onclick="document.getElementById('fotoInput').click()">
    📷 Tomar Foto del Bien / Etiqueta
  </button>
  <img id="previewImg" class="preview-img" alt="Vista previa del activo">

  <div style="margin-bottom: 12px;">
    <label>Observaciones</label>
    <textarea id="observacion" placeholder="Detalles del estado físico, cantidad de niveles, placa legible, etc..."></textarea>
  </div>

  <button type="button" class="btn-save" id="btnGuardar" onclick="guardarActivo()">💾 Guardar en Inventario FOSSO</button>
</div>

<div class="card">
  <h2 class="card-title" style="margin-bottom: 10px;">Historial Compartido (<span id="contadorActivos">0</span>)</h2>

  <div class="filter-bar">
    <div class="row-2" style="margin-bottom: 8px;">
      <div>
        <label style="font-size: 0.74rem;">Filtrar por Área:</label>
        <select id="filtroArea" onchange="resetPaginacion()" style="padding: 7px; font-size: 0.82rem;">
          <option value="TODAS">TODAS LAS ÁREAS</option>
          <option value="COMEDOR">COMEDOR</option>
          <option value="VAJILLA">VAJILLA</option>
          <option value="COCINA">COCINA</option>
          <option value="ALMACÉN DE ABARROTES">ALMACÉN DE ABARROTES</option>
          <option value="REEFER DE VERDURAS, TUBÉRCULOS Y FRUTAS">REEFER VERDURAS/TUB/FRUTAS</option>
          <option value="REEFER DE PRE ELABORADOS">REEFER PRE ELABORADOS</option>
        </select>
      </div>
      <div>
        <label style="font-size: 0.74rem;">Filtrar por Tipo de Bien:</label>
        <select id="filtroTipo" onchange="resetPaginacion()" style="padding: 7px; font-size: 0.82rem;">
          <option value="TODOS">TODOS LOS BIENES</option>
          <option value="EQUIPO / MAQUINARIA">EQUIPO / MAQUINARIA</option>
          <option value="MOBILIARIO">MOBILIARIO</option>
          <option value="ESTANTERÍA / RACKS">ESTANTERÍA / RACKS</option>
          <option value="MENAJE / VAJILLA">MENAJE / VAJILLA</option>
          <option value="CÓMPUTO / ELECTRÓNICA">CÓMPUTO / ELECTRÓNICA</option>
          <option value="OTROS BIENES">OTROS BIENES</option>
        </select>
      </div>
    </div>
    <input type="text" id="buscadorTexto" placeholder="🔍 Buscar por código AF, descripción o serie..." oninput="resetPaginacion()" style="padding: 7px; font-size: 0.82rem;">
  </div>

  <div id="listaHistorial"></div>
  <button type="button" id="btnVerMas" class="btn-more" style="display:none;" onclick="verMasItems()">⬇️ Mostrar 25 registros anteriores</button>
</div>

<footer>
  DESARROLLADO POR ING ANTONIO GUANILO GONZALES
</footer>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbz4FhZfK13GEGwj80VRm0M3D0tV8LBtili77zeECOWeO9fNDH6zC9F3VOycB2PDAwI/exec";

  let activos = [];
  let fotosLocalesIDB = {};
  let fotoBase64Actual = "";
  let editandoId = null;
  let scannerActivo = false;
  let lecturasConfirmadas = {};
  let sincronizando = false;
  let subiendoAhora = false;
  let limiteVisible = 25;

  function abrirDBFotos() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open("FossoFotosDB", 1);
      req.onupgradeneeded = e => {
        e.target.result.createObjectStore("fotos", { keyPath: "id" });
      };
      req.onsuccess = e => resolve(e.target.result);
      req.onerror = e => reject(e);
    });
  }

  async function guardarFotoIDB(id, base64) {
    if (!base64 || !base64.startsWith("data:image")) return;
    fotosLocalesIDB[String(id)] = base64;
    try {
      const db = await abrirDBFotos();
      const tx = db.transaction("fotos", "readwrite");
      tx.objectStore("fotos").put({ id: String(id), base64: base64 });
    } catch (e) {}
  }

  async function cargarFotosIDB() {
    try {
      const db = await abrirDBFotos();
      const tx = db.transaction("fotos", "readonly");
      const req = tx.objectStore("fotos").getAll();
      req.onsuccess = () => {
        (req.result || []).forEach(r => {
          fotosLocalesIDB[String(r.id)] = r.base64;
        });
        actualizarUI();
      };
    } catch (e) {}
  }

  try {
    localStorage.removeItem('fosso_activos_af');
    activos = JSON.parse(localStorage.getItem('fosso_activos_ligero')) || [];
  } catch (e) {
    activos = [];
  }

  function guardarCacheLigera() {
    try {
      const sinFotos = activos.map(({ foto, fotoBase64, ...resto }) => resto);
      localStorage.setItem('fosso_activos_ligero', JSON.stringify(sinFotos));
    } catch (e) {}
  }

  cargarFotosIDB();
  actualizarUI();
  sincronizarNube(false);
  setInterval(() => sincronizarNube(false), 25000);

  async function sincronizarNube(manual) {
    if (sincronizando || subiendoAhora) return;
    sincronizando = true;
    const statusEl = document.getElementById('syncStatus');
    if (manual) statusEl.innerText = "● Actualizando...";
    try {
      const resp = await fetch(`${API_URL}?t=${Date.now()}`, { method: 'GET', redirect: 'follow' });
      if (!resp.ok) throw new Error("HTTP " + resp.status);
      const data = await resp.json();
      if (Array.isArray(data)) {
        // Guardar en IndexedDB las fotos antiguas (Base64) que vengan de Sheets
        for (const item of data) {
          if (item.fotoBase64 && item.fotoBase64.startsWith("data:image")) {
            guardarFotoIDB(item.id, item.fotoBase64);
          }
        }
        const idsNube = new Set(data.map(d => String(d.id)));
        const pendientes = activos.filter(a => !idsNube.has(String(a.id)) && (Date.now() - Number(a.id) < 30000));
        activos = [...data, ...pendientes].map((item, idx) => ({ ...item, item: idx + 1 }));
        guardarCacheLigera();
        actualizarUI();
        statusEl.innerText = `● En línea (${activos.length} activos)`;
        statusEl.style.color = "#a3e4d7";
      }
    } catch (e) {
      statusEl.innerText = "● Modo campo (Toca 🔄 con señal)";
      statusEl.style.color = "#f9e79f";
    } finally {
      sincronizando = false;
    }
  }

  async function obtenerBase64DeActivo(a) {
    const local = fotosLocalesIDB[String(a.id)];
    if (local && local.startsWith("data:image")) return local;

    if (a.fotoBase64 && a.fotoBase64.startsWith("data:image")) {
      guardarFotoIDB(a.id, a.fotoBase64);
      return a.fotoBase64;
    }

    if (a.fotoUrl && a.fotoUrl.startsWith("http")) {
      try {
        const resp = await fetch(a.fotoUrl);
        const blob = await resp.blob();
        return await new Promise((resolve) => {
          const reader = new FileReader();
          reader.onloadend = () => {
            if (reader.result) guardarFotoIDB(a.id, reader.result);
            resolve(reader.result);
          };
          reader.readAsDataURL(blob);
        });
      } catch (e) {
        return null;
      }
    }
    return null;
  }

  function verificarHistorialLocal(valor) {
    if (editandoId) return;
    const limpio = valor.toUpperCase().replace(/AF\s*-\s*/g, '').trim();
    const msg = document.getElementById('lookupMsg');
    if (!limpio) {
      msg.style.display = "none";
      return;
    }

    const existente = activos.find(a => a.codigoAF === `AF - ${limpio}`);
    if (existente) {
      document.getElementById('nombreEquipo').value = existente.nombre;
      document.getElementById('marcaModelo').value = existente.marcaModelo;
      document.getElementById('numSerie').value = existente.numSerie;
      msg.innerText = `⚠️ Ya registrado (${existente.area}): ${existente.nombre}`;
      msg.style.display = "block";
    } else {
      msg.style.display = "none";
    }
  }

  async function cargarParaEditar(id) {
    const item = activos.find(a => String(a.id) === String(id));
    if (!item) return;

    editandoId = item.id;

    document.getElementById('formCard').classList.add('editing-mode');
    document.getElementById('formTitle').innerText = `Editando Activo #${item.item}`;
    document.getElementById('btnNuevoRegistro').style.display = 'inline-block';
    document.getElementById('editBanner').style.display = 'block';
    document.getElementById('editItemNum').innerText = item.item;

    const btnGuardar = document.getElementById('btnGuardar');
    btnGuardar.innerText = "💾 Guardar Cambios";
    btnGuardar.classList.add('update-mode');

    document.getElementById('itemNum').value = item.item;
    const rawNum = item.codigoAF === "SIN CÓDIGO AF" ? "" : String(item.codigoAF).replace(/AF\s*-\s*/gi, '').trim();
    document.getElementById('numAF').value = rawNum;
    document.getElementById('campanaInv').value = item.campanaInv || "INV 2026";
    document.getElementById('categoriaBien').value = item.categoriaBien || "EQUIPO / MAQUINARIA";
    document.getElementById('condicion').value = item.condicion || "BUENO";
    document.getElementById('area').value = item.area || "COMEDOR";
    document.getElementById('unidad').value = item.unidad || "";
    document.getElementById('nombreEquipo').value = item.nombre || "";
    document.getElementById('marcaModelo').value = item.marcaModelo === "S/M" ? "" : item.marcaModelo;
    document.getElementById('numSerie').value = item.numSerie === "S/N" ? "" : item.numSerie;
    document.getElementById('observacion').value = item.observacion === "Sin observaciones" ? "" : item.observacion;
    document.getElementById('lookupMsg').style.display = "none";

    fotoBase64Actual = "";
    const fotoExistente = await obtenerBase64DeActivo(item);
    const preview = document.getElementById('previewImg');
    const btnFoto = document.getElementById('btnFoto');
    if (fotoExistente) {
      preview.src = fotoExistente;
      preview.style.display = 'block';
      btnFoto.classList.add('has-photo');
      btnFoto.innerText = "📷 Cambiar Foto Actual";
    } else {
      preview.style.display = 'none';
      btnFoto.classList.remove('has-photo');
      btnFoto.innerText = "📷 Tomar Foto del Bien / Etiqueta";
    }

    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function activarModoNuevo() {
    editandoId = null;

    document.getElementById('formCard').classList.remove('editing-mode');
    document.getElementById('formTitle').innerText = "Registro de Activo FOSSO";
    document.getElementById('btnNuevoRegistro').style.display = 'none';
    document.getElementById('editBanner').style.display = 'none';

    const btnGuardar = document.getElementById('btnGuardar');
    btnGuardar.innerText = "💾 Guardar en Inventario FOSSO";
    btnGuardar.classList.remove('update-mode');

    limpiarCamposFormulario();
    document.getElementById('itemNum').value = activos.length + 1;
  }

  function limpiarCamposFormulario() {
    document.getElementById('numAF').value = "";
    document.getElementById('nombreEquipo').value = "";
    document.getElementById('marcaModelo').value = "";
    document.getElementById('numSerie').value = "";
    document.getElementById('observacion').value = "";
    document.getElementById('lookupMsg').style.display = "none";
    fotoBase64Actual = "";
    document.getElementById('previewImg').style.display = 'none';
    const btn = document.getElementById('btnFoto');
    btn.classList.remove('has-photo');
    btn.innerText = "📷 Tomar Foto del Bien / Etiqueta";
  }

  function toggleScanner() {
    const container = document.getElementById('scannerContainer');
    const btn = document.getElementById('btnScan');

    if (scannerActivo) {
      detenerScanner();
      return;
    }

    container.style.display = 'block';
    btn.innerText = '✖';
    btn.classList.add('active');
    scannerActivo = true;
    lecturasConfirmadas = {};

    Quagga.init({
      inputStream: {
        name: "Live",
        type: "LiveStream",
        target: container,
        constraints: {
          facingMode: "environment",
          width: { ideal: 1920 },
          height: { ideal: 1080 }
        },
        area: { top: "25%", right: "12%", left: "12%", bottom: "25%" }
      },
      locator: { patchSize: "large", halfSample: false },
      numOfWorkers: 0,
      frequency: 15,
      decoder: {
        readers: ["code_128_reader", "code_39_reader", "i2of5_reader", "code_93_reader"]
      },
      locate: true
    }, function(err) {
      if (err) {
        alert("Error cámara: " + err);
        detenerScanner();
        return;
      }
      Quagga.start();

      setTimeout(() => {
        const track = Quagga.CameraAccess.getActiveTrack();
        if (track && track.getCapabilities) {
          const caps = track.getCapabilities();
          if (caps.zoom) {
            track.applyConstraints({ advanced: [{ zoom: Math.min(2.2, caps.zoom.max) }] }).catch(() => {});
          }
        }
      }, 500);
    });

    Quagga.onDetected(function(data) {
      if (!data || !data.codeResult || !data.codeResult.code) return;
      const raw = data.codeResult.code.trim();
      lecturasConfirmadas[raw] = (lecturasConfirmadas[raw] || 0) + 1;
      if (lecturasConfirmadas[raw] >= 2) {
        const limpio = raw.toUpperCase().replace(/[^0-9A-Z]/g, '').replace(/^AF/, '');
        document.getElementById('numAF').value = limpio;
        verificarHistorialLocal(limpio);
        if (navigator.vibrate) navigator.vibrate(100);
        detenerScanner();
      }
    });
  }

  function escanearDesdeFoto(event) {
    const file = event.target.files[0];
    if (!file) return;
    const url = URL.createObjectURL(file);

    Quagga.decodeSingle({
      src: url,
      numOfWorkers: 0,
      inputStream: { size: 1280 },
      decoder: {
        readers: ["code_128_reader", "code_39_reader", "i2of5_reader", "code_93_reader"]
      }
    }, function(result) {
      if (result && result.codeResult) {
        const limpio = result.codeResult.code.toUpperCase().replace(/[^0-9A-Z]/g, '').replace(/^AF/, '');
        document.getElementById('numAF').value = limpio;
        verificarHistorialLocal(limpio);
      } else {
        alert("No se detectó el código de barras en la foto. Puedes digitar los 4 dígitos manualmente.");
      }
    });
  }

  function detenerScanner() {
    try { Quagga.offDetected(); Quagga.stop(); } catch (e) {}
    document.getElementById('scannerContainer').style.display = 'none';
    const btn = document.getElementById('btnScan');
    btn.innerText = '📷 Vivo';
    btn.classList.remove('active');
    scannerActivo = false;
  }

  function procesarFoto(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement('canvas');
        const MAX_WIDTH = 300;
        const scale = MAX_WIDTH / img.width;
        canvas.width = MAX_WIDTH;
        canvas.height = img.height * scale;

        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        fotoBase64Actual = canvas.toDataURL('image/jpeg', 0.55);

        const preview = document.getElementById('previewImg');
        preview.src = fotoBase64Actual;
        preview.style.display = 'block';

        const btn = document.getElementById('btnFoto');
        btn.classList.add('has-photo');
        btn.innerText = "✅ Nueva Foto Lista (Tocar para cambiar)";
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  async function guardarActivo() {
    const rawAF = document.getElementById('numAF').value.trim().toUpperCase().replace(/AF\s*-\s*/g, '');
    const nombre = document.getElementById('nombreEquipo').value.trim();

    if (!nombre) {
      alert("Ingresa la descripción del objeto o equipo.");
      return;
    }

    const codigoAF = rawAF ? `AF - ${rawAF}` : "SIN CÓDIGO AF";

    if (!editandoId && rawAF && activos.some(a => a.codigoAF === codigoAF)) {
      if (!confirm(`El código ${codigoAF} ya fue registrado en el historial compartido. ¿Deseas guardarlo de todas formas?`)) return;
    }

    const btnGuardar = document.getElementById('btnGuardar');
    btnGuardar.disabled = true;
    btnGuardar.innerText = editandoId ? "⏳ Actualizando..." : "⏳ Subiendo foto y datos...";
    subiendoAhora = true;

    try {
      if (editandoId) {
        const idx = activos.findIndex(a => String(a.id) === String(editandoId));
        if (idx !== -1) {
          const actualizado = {
            ...activos[idx],
            codigoAF: codigoAF,
            campanaInv: document.getElementById('campanaInv').value,
            categoriaBien: document.getElementById('categoriaBien').value,
            unidad: document.getElementById('unidad').value.trim() || "No especificada",
            area: document.getElementById('area').value,
            condicion: document.getElementById('condicion').value,
            nombre: nombre,
            marcaModelo: document.getElementById('marcaModelo').value.trim() || "S/M",
            numSerie: document.getElementById('numSerie').value.trim() || "S/N",
            observacion: document.getElementById('observacion').value.trim() || "Sin observaciones"
          };

          if (fotoBase64Actual) {
            await guardarFotoIDB(editandoId, fotoBase64Actual);
          }

          activos[idx] = actualizado;
          guardarCacheLigera();
          actualizarUI();

          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 15000);
          await fetch(API_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: "update", ...actualizado, fotoNueva: fotoBase64Actual }),
            signal: controller.signal
          });
          clearTimeout(timeoutId);
        }
        activarModoNuevo();
      } else {
        const itemId = Date.now();
        const fotoParaSubir = fotoBase64Actual;

        const nuevoItem = {
          id: itemId,
          item: activos.length + 1,
          codigoAF: codigoAF,
          campanaInv: document.getElementById('campanaInv').value,
          categoriaBien: document.getElementById('categoriaBien').value,
          unidad: document.getElementById('unidad').value.trim() || "No especificada",
          area: document.getElementById('area').value,
          condicion: document.getElementById('condicion').value,
          nombre: nombre,
          marcaModelo: document.getElementById('marcaModelo').value.trim() || "S/M",
          numSerie: document.getElementById('numSerie').value.trim() || "S/N",
          fechaRegistro: new Date().toLocaleDateString('es-PE'),
          observacion: document.getElementById('observacion').value.trim() || "Sin observaciones"
        };

        if (fotoParaSubir) {
          await guardarFotoIDB(itemId, fotoParaSubir);
        }

        activos.push(nuevoItem);
        guardarCacheLigera();
        actualizarUI();
        limpiarCamposFormulario();

        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 15000);
        await fetch(API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ ...nuevoItem, foto: fotoParaSubir }),
          signal: controller.signal
        });
        clearTimeout(timeoutId);
      }
    } catch (e) {
      console.warn("Guardado local asegurado, pendiente de red:", e);
    } finally {
      subiendoAhora = false;
      btnGuardar.disabled = false;
      btnGuardar.innerText = editandoId ? "💾 Guardar Cambios" : "💾 Guardar en Inventario FOSSO";
    }
  }

  async function eliminarActivo(id) {
    if (!confirm("¿Eliminar este registro del historial compartido?")) return;
    if (String(editandoId) === String(id)) activarModoNuevo();

    activos = activos.filter(a => String(a.id) !== String(id)).map((a, idx) => ({ ...a, item: idx + 1 }));
    guardarCacheLigera();
    actualizarUI();

    try {
      await fetch(API_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: "delete", id: id })
      });
    } catch (e) {}
  }

  function resetPaginacion() {
    limiteVisible = 25;
    actualizarUI();
  }

  function verMasItems() {
    limiteVisible += 25;
    actualizarUI();
  }

  function obtenerFiltrados() {
    const fArea = document.getElementById('filtroArea').value;
    const fTipo = document.getElementById('filtroTipo').value;
    const q = (document.getElementById('buscadorTexto').value || "").toLowerCase().trim();

    return activos.filter(a => {
      const okArea = fArea === "TODAS" || a.area === fArea;
      const okTipo = fTipo === "TODOS" || (a.categoriaBien || "EQUIPO / MAQUINARIA") === fTipo;
      const okTexto = !q ||
        String(a.codigoAF).toLowerCase().includes(q) ||
        String(a.nombre).toLowerCase().includes(q) ||
        String(a.numSerie).toLowerCase().includes(q);
      return okArea && okTipo && okTexto;
    });
  }

  function actualizarUI() {
    if (!editandoId) {
      document.getElementById('itemNum').value = activos.length + 1;
    }
    const filtrados = obtenerFiltrados();
    document.getElementById('contadorActivos').innerText = `${filtrados.length} de ${activos.length}`;
    const contenedor = document.getElementById('listaHistorial');
    const btnMore = document.getElementById('btnVerMas');

    if (filtrados.length === 0) {
      contenedor.innerHTML = '<p style="color: var(--text-muted); font-size: 0.88rem;">No hay bienes registrados con este filtro.</p>';
      btnMore.style.display = 'none';
      return;
    }

    const ordenados = [...filtrados].reverse();
    const visibles = ordenados.slice(0, limiteVisible);

    btnMore.style.display = ordenados.length > limiteVisible ? 'block' : 'none';
    btnMore.innerText = `⬇️ Ver más (${ordenados.length - limiteVisible} restantes)`;

    contenedor.innerHTML = visibles.map(a => {
      const fotoLocal = fotosLocalesIDB[String(a.id)] || a.fotoBase64;
      const thumbHtml = (fotoLocal && fotoLocal.startsWith("data:image"))
        ? `<img src="${fotoLocal}" class="history-thumb">`
        : (a.fotoUrl && a.fotoUrl.startsWith("http")
            ? `<img src="${a.fotoUrl}" class="history-thumb" onerror="this.style.display='none'">`
            : `<div class="history-thumb" style="display:flex;align-items:center;justify-content:center;font-size:0.68rem;color:#666;">Sin foto</div>`);

      return `
        <div class="history-item">
          ${thumbHtml}
          <div class="history-info">
            <span class="tag-pill">${a.codigoAF}</span> <span class="cat-pill">${a.categoriaBien || 'EQUIPO'}</span><br>
            <strong>#${a.item} - ${a.nombre}</strong><br>
            <span>Ref: <b>${a.numSerie}</b> | ${a.marcaModelo}</span><br>
            <span>${a.unidad} · <b>${a.area}</b></span> · <span class="badge ${a.condicion}">${a.condicion}</span>
          </div>
          <div class="item-actions">
            <button class="btn-edit" onclick="cargarParaEditar('${a.id}')">✏️ Editar</button>
            <button class="btn-del" onclick="eliminarActivo('${a.id}')">✕</button>
          </div>
        </div>
      `;
    }).join('');
  }

  async function exportarExcel() {
    if (activos.length === 0) {
      alert("No hay datos para exportar.");
      return;
    }

    const btnExcel = document.getElementById('btnExportExcel');
    btnExcel.disabled = true;
    btnExcel.innerText = "⏳...";

    try {
      const workbook = new ExcelJS.Workbook();

      async function crearHojaConFotos(nombreHoja, listaItems) {
        const sheet = workbook.addWorksheet(nombreHoja.substring(0, 31));
        sheet.columns = [
          { header: 'Ítem', key: 'item', width: 7 },
          { header: 'Código FOSSO', key: 'codigoAF', width: 15 },
          { header: 'Campaña', key: 'campana', width: 12 },
          { header: 'Tipo de Bien', key: 'tipo', width: 22 },
          { header: 'Sede / Unidad', key: 'unidad', width: 18 },
          { header: 'Área Operativa', key: 'area', width: 32 },
          { header: 'Descripción del Bien', key: 'nombre', width: 32 },
          { header: 'Marca / Modelo / Material', key: 'marca', width: 22 },
          { header: 'N° Serie / Medidas', key: 'serie', width: 18 },
          { header: 'Estado Físico', key: 'estado', width: 14 },
          { header: 'Fecha', key: 'fecha', width: 13 },
          { header: 'Observaciones', key: 'obs', width: 28 },
          { header: 'Evidencia Fotográfica', key: 'foto', width: 20 }
        ];

        const headerRow = sheet.getRow(1);
        headerRow.height = 24;
        headerRow.eachCell(cell => {
          cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF163A5F' } };
          cell.font = { color: { argb: 'FFFFFFFF' }, bold: true, size: 10 };
          cell.alignment = { vertical: 'middle', horizontal: 'center' };
        });
        sheet.autoFilter = 'A1:M1';

        for (let i = 0; i < listaItems.length; i++) {
          const a = listaItems[i];
          const rowIndex = i + 2;
          const row = sheet.addRow({
            item: i + 1,
            codigoAF: a.codigoAF,
            campana: a.campanaInv,
            tipo: a.categoriaBien || "EQUIPO / MAQUINARIA",
            unidad: a.unidad,
            area: a.area,
            nombre: a.nombre,
            marca: a.marcaModelo,
            serie: a.numSerie,
            estado: a.condicion,
            fecha: a.fechaRegistro,
            obs: a.observacion,
            foto: ""
          });

          row.alignment = { vertical: 'middle', wrapText: true };
          const base64Img = await obtenerBase64DeActivo(a);
          if (base64Img && base64Img.startsWith("data:image")) {
            row.height = 75;
            const imageId = workbook.addImage({
              base64: base64Img,
              extension: 'jpeg'
            });
            sheet.addImage(imageId, {
              tl: { col: 12.1, row: rowIndex - 0.9 },
              ext: { width: 95, height: 85 }
            });
          } else {
            row.height = 24;
          }
        }
      }

      await crearHojaConFotos("GENERAL (CON FILTROS)", activos);

      const tiposUnicos = [...new Set(activos.map(a => a.categoriaBien || "EQUIPO / MAQUINARIA"))];
      for (const tipo of tiposUnicos) {
        const sub = activos.filter(a => (a.categoriaBien || "EQUIPO / MAQUINARIA") === tipo);
        await crearHojaConFotos("TIPO - " + tipo.replace(/[\\\/\?\*\[\]]/g, ''), sub);
      }

      const areasUnicas = [...new Set(activos.map(a => a.area))];
      for (const area of areasUnicas) {
        const sub = activos.filter(a => a.area === area);
        await crearHojaConFotos("AREA - " + area.replace(/[\\\/\?\*\[\]]/g, ''), sub);
      }

      const buffer = await workbook.xlsx.writeBuffer();
      const blob = new Blob([buffer], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `Inventario_Fisico_FOSSO_${new Date().toISOString().slice(0,10)}.xlsx`;
      link.click();
    } catch (e) {
      alert("Error al generar Excel: " + e.message);
    } finally {
      btnExcel.disabled = false;
      btnExcel.innerText = "📊 Excel";
    }
  }

  async function generarPDF() {
    const listaExportar = obtenerFiltrados();
    if (listaExportar.length === 0) {
      alert("No hay bienes inventariados para exportar en esta vista.");
      return;
    }

    if (listaExportar.length > 250) {
      alert(`Estás exportando ${listaExportar.length} registros. Para evitar que el celular se quede sin memoria con tantas fotos, filtra por Área antes de generar el PDF.`);
    }

    const btnPdf = document.getElementById('btnExportPdf');
    btnPdf.disabled = true;
    btnPdf.innerText = "⏳...";

    try {
      const fotosResueltas = {};
      for (const a of listaExportar) {
        fotosResueltas[String(a.id)] = await obtenerBase64DeActivo(a);
      }

      const { jsPDF } = window.jspdf;
      const doc = new jsPDF('p', 'mm', 'a4');

      doc.setFillColor(22, 58, 95);
      doc.rect(0, 0, 210, 24, 'F');
      doc.setTextColor(255, 255, 255);
      doc.setFontSize(14);
      doc.setFont("helvetica", "bold");
      doc.text("INVENTARIO FISICO FOSSO", 14, 15);
      doc.setFontSize(9.5);
      doc.setFont("helvetica", "normal");
      doc.text(`Fecha: ${new Date().toLocaleDateString('es-PE')}`, 165, 15);

      const filas = listaExportar.map((a, idx) => [
        idx + 1,
        `${a.codigoAF}\n(${a.campanaInv})\n[${a.categoriaBien || 'EQUIPO'}]`,
        `${a.nombre}\nMarca/Mat: ${a.marcaModelo}\nSerie/Med: ${a.numSerie}`,
        `${a.unidad}\nÁrea: ${a.area}\nEstado: ${a.condicion}`,
        `${a.observacion}`,
        ""
      ]);

      doc.autoTable({
        startY: 30,
        head: [['Ítem', 'Cód. / Categoría', 'Descripción / Detalle', 'Ubicación / Estado', 'Observaciones', 'Evidencia']],
        body: filas,
        theme: 'grid',
        headStyles: { fillColor: [22, 58, 95], textColor: 255, fontSize: 8, halign: 'center' },
        styles: { fontSize: 7.5, cellPadding: 2.5, valign: 'middle' },
        columnStyles: {
          0: { cellWidth: 9, halign: 'center' },
          1: { cellWidth: 30, halign: 'center', fontStyle: 'bold' },
          2: { cellWidth: 42 },
          3: { cellWidth: 35 },
          4: { cellWidth: 28 },
          5: { cellWidth: 38, minCellHeight: 30 }
        },
        didDrawCell: function(data) {
          if (data.section === 'body' && data.column.index === 5) {
            const a = listaExportar[data.row.index];
            const foto = a ? fotosResueltas[String(a.id)] : null;
            if (foto && foto.startsWith('data:image')) {
              doc.addImage(foto, 'JPEG', data.cell.x + 2, data.cell.y + 2, 34, 26);
            }
          }
        }
      });

      const finalY = doc.lastAutoTable.finalY + 10;
      doc.setTextColor(31, 45, 61);
      doc.setFontSize(9);
      doc.setFont("helvetica", "bold");
      doc.text(`Total de bienes inventariados: ${listaExportar.length} unidad(es).`, 14, finalY);

      doc.save(`Inventario_Fisico_FOSSO_${new Date().toISOString().slice(0,10)}.pdf`);
    } catch (e) {
      alert("Error al generar PDF: " + e.message);
    } finally {
      btnPdf.disabled = false;
      btnPdf.innerText = "📄 PDF";
    }
  }
</script>
